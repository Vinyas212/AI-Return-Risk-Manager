# PUT THIS AT: src/main/resources/application.properties
# (this file likely already exists in your generated project - just add these lines to it)

# The port your Spring Boot backend runs on.
# 9090 (not 8080) so it doesn't clash with anything else you might run.
server.port=9090

# The address of your Python ML service (running on port 8000 from earlier).
ml.service.url=http://localhost:8000

# The risk score at/above which an order gets flagged.
# 0.5 is a reasonable starting point - you can tune this later.
risk.threshold=0.5

# MongoDB connection string.
# We'll set up a free MongoDB Atlas cluster in the next step and you'll
# replace this placeholder with your real connection string.
spring.data.mongodb.uri=${MONGODB_URI}
app.cors.allowed-origin=http://localhost:5173
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.password=${APP_ADMIN_PASSWORD}